version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-${DB_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data-mysql:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-${DB_NAME}
    environment:
      PMA_HOST: mysql
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      - mysql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-${DB_NAME}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    volumes:
      - ./src/temp:/app/src/temp
      - ./src/uploads:/app/src/uploads
      - ./formulario-publico:/app/formulario-publico
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped
